<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ВидеоСвязь</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --bg2: #12121a;
    --bg3: #1a1a26;
    --border: rgba(255,255,255,0.1);
    --text: #e8e8f0;
    --text2: #8888a8;
    --green: #2ecc71;
    --yellow: #f1c40f;
    --red: #e74c3c;
    --blue: #3b82f6;
    --blue2: #1d4ed8;
    --radius: 14px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── ЭКРАН ОЖИДАНИЯ ── */
  #screen-wait {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 24px;
    gap: 0;
  }

  .app-title {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
    letter-spacing: -0.3px;
  }

  .app-sub {
    font-size: 14px;
    color: var(--text2);
    margin-bottom: 32px;
  }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-width: 380px;
  }

  .card-label {
    font-size: 12px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
  }

  .my-id-box {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 12px;
  }

  .my-id-val {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 5px;
    color: #7dd3fc;
    font-family: 'Courier New', monospace;
  }

  .copy-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .copy-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
  .copy-btn.copied { color: var(--green); border-color: var(--green); }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 20px 0;
  }

  .input-wrap { position: relative; margin-bottom: 12px; }

  .input-wrap input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    color: var(--text);
    font-size: 22px;
    font-family: 'Courier New', monospace;
    letter-spacing: 6px;
    text-align: center;
    outline: none;
    transition: border-color 0.15s;
  }
  .input-wrap input::placeholder { color: var(--text2); font-family: -apple-system, sans-serif; letter-spacing: 0; text-transform: none; font-size: 15px; text-align: center; }
  .input-wrap input:focus { border-color: var(--blue); }

  .btn-primary {
    width: 100%;
    background: var(--blue);
    border: none;
    border-radius: 10px;
    padding: 14px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .btn-primary:hover { background: var(--blue2); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary:disabled { background: var(--bg3); color: var(--text2); cursor: not-allowed; }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    font-size: 13px;
    color: var(--text2);
    min-height: 20px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text2);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.green { background: var(--green); }
  .status-dot.yellow { background: var(--yellow); animation: pulse 1.2s infinite; }
  .status-dot.red { background: var(--red); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* ── ВХОДЯЩИЙ ЗВОНОК ── */
  #screen-incoming {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 24px;
    padding: 24px;
  }
  #screen-incoming.show { display: flex; }

  .incoming-avatar {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: var(--bg3);
    border: 3px solid var(--green);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    animation: ring 1.2s ease-in-out infinite;
  }
  @keyframes ring {
    0%,100%{ box-shadow: 0 0 0 0 rgba(46,204,113,0.5); }
    50%{ box-shadow: 0 0 0 20px rgba(46,204,113,0); }
  }

  .incoming-title { font-size: 20px; font-weight: 600; }
  .incoming-sub { font-size: 14px; color: var(--text2); font-family: monospace; }

  .incoming-btns {
    display: flex; gap: 24px; margin-top: 8px;
  }

  .btn-accept, .btn-reject {
    width: 68px; height: 68px;
    border-radius: 50%; border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; cursor: pointer;
    transition: transform 0.1s, filter 0.1s;
  }
  .btn-accept { background: var(--green); }
  .btn-reject { background: var(--red); }
  .btn-accept:hover,.btn-reject:hover { filter: brightness(1.15); }
  .btn-accept:active,.btn-reject:active { transform: scale(0.93); }

  /* ── ЭКРАН ЗВОНКА ── */
  #screen-call {
    display: none;
    position: fixed; inset: 0;
    background: #000;
    flex-direction: column;
  }
  #screen-call.show { display: flex; }

  .video-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #000;
  }

  #remoteVideo {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  /* PiP — моё видео */
  .pip-wrap {
    position: absolute;
    bottom: 16px; right: 16px;
    width: 110px; height: 82px;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.25);
    cursor: grab;
    touch-action: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    z-index: 10;
    transition: border-color 0.2s;
  }
  .pip-wrap:active { cursor: grabbing; border-color: rgba(255,255,255,0.5); }

  #localVideo {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transform: scaleX(-1);
  }

  .pip-label {
    position: absolute;
    bottom: 5px; left: 7px;
    font-size: 10px;
    color: rgba(255,255,255,0.7);
    pointer-events: none;
  }

  /* Оверлеи на большом видео */
  .call-overlay {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 16px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, transparent 100%);
    pointer-events: none;
    z-index: 5;
  }

  .call-timer {
    font-size: 16px;
    font-weight: 500;
    color: #fff;
  }

  .quality-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,0,0,0.45);
    border-radius: 20px;
    padding: 5px 11px;
    font-size: 12px;
    color: #fff;
    pointer-events: none;
  }

  .q-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    transition: background 0.4s;
  }

  .no-video-overlay {
    position: absolute; inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    background: var(--bg);
    z-index: 4;
  }
  .no-video-overlay.show { display: flex; }
  .no-video-overlay .icon { font-size: 52px; }
  .no-video-overlay p { font-size: 16px; color: var(--text2); text-align: center; max-width: 240px; line-height: 1.5; }

  /* Панель управления */
  .controls-bar {
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(12px);
    padding: 14px 20px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    z-index: 10;
  }

  .ctrl {
    width: 54px; height: 54px;
    border-radius: 50%;
    border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    cursor: pointer;
    transition: transform 0.1s, filter 0.1s, background 0.15s;
    background: rgba(255,255,255,0.12);
    color: #fff;
  }
  .ctrl:hover { filter: brightness(1.2); }
  .ctrl:active { transform: scale(0.92); }
  .ctrl.off { background: rgba(255,255,255,0.07); filter: brightness(0.6); }
  .ctrl.end { background: var(--red); width: 64px; height: 64px; font-size: 26px; }
  .ctrl.end:hover { filter: brightness(1.15); }

  /* ── ЧАТ ── */
  .chat-panel {
    position: absolute;
    bottom: 90px; left: 0; right: 0;
    max-height: 220px;
    display: flex;
    flex-direction: column;
    z-index: 8;
    transition: opacity 0.3s;
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 8px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    scrollbar-width: none;
  }

  .chat-msg {
    max-width: 75%;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
    word-break: break-word;
  }
  .chat-msg.me {
    align-self: flex-end;
    background: var(--blue);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .chat-msg.them {
    align-self: flex-start;
    background: rgba(255,255,255,0.15);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }

  .chat-input-row {
    display: flex;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(0,0,0,0.5);
  }

  .chat-input-row input {
    flex: 1;
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 9px 16px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .chat-input-row input::placeholder { color: var(--text2); }

  .chat-send {
    background: var(--blue);
    border: none;
    border-radius: 50%;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .chat-send:hover { background: var(--blue2); }

  .chat-hidden { display: none !important; }

  /* Уведомление о новом сообщении */
  .chat-badge {
    position: absolute;
    top: -4px; right: -4px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--red);
    font-size: 10px;
    color: #fff;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .chat-badge.show { display: flex; }

  /* Кнопка чата с позицией relative */
  .ctrl-chat-wrap {
    position: relative;
  }

  /* Предупреждение о слабой связи */
  .weak-banner {
    position: absolute;
    top: 60px; left: 50%;
    transform: translateX(-50%);
    background: rgba(241,196,15,0.9);
    color: #000;
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    font-weight: 500;
    z-index: 9;
    display: none;
    white-space: nowrap;
    pointer-events: none;
  }
  .weak-banner.show { display: block; }

  @media (max-width: 400px) {
    .pip-wrap { width: 90px; height: 68px; }
    .ctrl { width: 48px; height: 48px; font-size: 20px; }
    .ctrl.end { width: 58px; height: 58px; }
    .my-id-val { font-size: 18px; letter-spacing: 2px; }
  }
</style>
</head>
<body>
<script>
// ══ РАННЯЯ ДИАГНОСТИКА — выполняется ДО всего остального ══
console.log('[Boot] 🚀 HTML загружен. Время:', new Date().toISOString());
console.log('[Boot] URL страницы:', location.href);
console.log('[Boot] Протокол:', location.protocol, '(нужен https: или file: для getUserMedia)');
window.__bootTime = Date.now();
window.onerror = (msg, src, line, col, err) => {
  console.error('[Boot] ❌ Глобальная ошибка JS:', msg, '| файл:', src, '| строка:', line);
};
</script>

<!-- ══════════════════════════════════════
     ЭКРАН ОЖИДАНИЯ
════════════════════════════════════════ -->
<div id="screen-wait">
  <div class="app-title">📞 ВидеоСвязь</div>
  <div class="app-sub">Безопасная связь без посредников</div>

  <div class="card">
    <div class="card-label">Твой код</div>
    <div class="my-id-box">
      <div class="my-id-val" id="myIdVal">——</div>
      <button class="copy-btn" id="copyBtn" onclick="copyId()">Копировать</button>
    </div>

    <div style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:20px;">
      Сообщи этот код собеседнику.<br>
      Он <strong style="color:var(--text)">постоянный</strong> — не меняется при перезагрузке.
    </div>

    <div class="divider"></div>

    <div class="card-label">Позвонить</div>
    <div class="input-wrap">
      <input
        id="callInput"
        type="tel"
        inputmode="numeric"
        pattern="[0-9]*"
        placeholder="Введи 6 цифр"
        maxlength="6"
        autocomplete="off"
        oninput="this.value=this.value.replace(/\D/g,'')"
      />
    </div>
    <button class="btn-primary" id="callBtn" onclick="startCall()" disabled>
      📞 Позвонить
    </button>

    <div class="status-row">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Подключаемся к серверу…</span>
    </div>
  </div>
</div>


<!-- ══════════════════════════════════════
     ВХОДЯЩИЙ ЗВОНОК
════════════════════════════════════════ -->
<div id="screen-incoming">
  <div class="incoming-avatar">👤</div>
  <div class="incoming-title">Входящий звонок</div>
  <div class="incoming-sub" id="incomingId"></div>
  <div class="incoming-btns">
    <button class="btn-reject" onclick="rejectCall()" title="Отклонить">✕</button>
    <button class="btn-accept" onclick="acceptCall()" title="Принять">✓</button>
  </div>
</div>


<!-- ══════════════════════════════════════
     ЭКРАН ЗВОНКА
════════════════════════════════════════ -->
<div id="screen-call">

  <!-- Большое видео собеседника -->
  <div class="video-wrap">
    <video id="remoteVideo" autoplay playsinline></video>

    <!-- Нет видео -->
    <div class="no-video-overlay" id="noVideoOverlay">
      <div class="icon">🎤</div>
      <p>Видео отключено — только аудио</p>
    </div>

    <!-- Верхний оверлей: таймер + качество -->
    <div class="call-overlay">
      <div class="call-timer" id="callTimer">00:00</div>
      <div class="quality-badge">
        <div class="q-dot" id="qualityDot"></div>
        <span id="qualityText">хорошее</span>
      </div>
    </div>

    <!-- Баннер слабой связи -->
    <div class="weak-banner" id="weakBanner">⚠ Слабый сигнал — видео отключено</div>

    <!-- PiP — моё видео -->
    <div class="pip-wrap" id="pipWrap">
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="pip-label">Я</div>
    </div>
  </div>

  <!-- Чат -->
  <div class="chat-panel chat-hidden" id="chatPanel">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row">
      <input id="chatInput" type="text" placeholder="Сообщение…" maxlength="500"
             onkeydown="if(event.key==='Enter')sendChatMsg()"/>
      <button class="chat-send" onclick="sendChatMsg()">➤</button>
    </div>
  </div>

  <!-- Панель кнопок -->
  <div class="controls-bar">
    <button class="ctrl" id="btnMic"    onclick="toggleMic()"    title="Микрофон">🎤</button>
    <button class="ctrl" id="btnVideo"  onclick="toggleVideo()"  title="Видео">📷</button>
    <button class="ctrl" id="btnCamera" onclick="switchCamera()" title="Камера">🔄</button>
    <button class="ctrl end"            onclick="endCall()"       title="Завершить">📵</button>
    <div class="ctrl-chat-wrap">
      <button class="ctrl" id="btnChat" onclick="toggleChat()"   title="Чат">💬</button>
      <div class="chat-badge" id="chatBadge">!</div>
    </div>
  </div>

</div>

</script>
<script>
// ════════════════════════════════════════
//  КОНФИГУРАЦИЯ
// ════════════════════════════════════════
const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:stun2.l.google.com:19302' },
  { urls: 'stun:stun3.l.google.com:19302' },
  { urls: 'turn:openrelay.metered.ca:80',
    username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443',
    username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp',
    username: 'openrelayproject', credential: 'openrelayproject' }
];

// ════════════════════════════════════════
//  СОСТОЯНИЕ
// ════════════════════════════════════════
let peer, localStream, currentCall, dataConn;
let micOn = true, videoOn = true, chatOpen = false;
let statsInterval, timerInterval, callSeconds = 0;
let facingMode = 'user';
let currentPc = null;
let incomingCall = null;

// ════════════════════════════════════════
//  ИНИЦИАЛИЗАЦИЯ
// ════════════════════════════════════════
window.addEventListener('load', initApp);

function make6digit() {
  return String(Math.floor(100000 + Math.random() * 900000));
}

function initApp() {
  let savedId = localStorage.getItem('myPeerId');
  if (!savedId || !/^\d{6}$/.test(savedId)) {
    savedId = make6digit();
    localStorage.setItem('myPeerId', savedId);
  }
  initPeer(savedId);
  setupPipDrag();
  document.getElementById('callInput').addEventListener('input', () => {
    const v = document.getElementById('callInput').value.trim();
    document.getElementById('callBtn').disabled = v.length < 6;
  });
}

function initPeer(customId) {
  setStatus('dot-yellow', 'Подключаемся к серверу…');
  console.log('[PeerJS] initPeer() →', customId);

  const opts = {
    config: { iceServers: ICE_SERVERS },
    debug: 3  // 0=off, 1=errors, 2=warnings, 3=all — включаем максимальный лог
  };
  if (customId) opts.id = customId;

  peer = new Peer(opts);

  peer.on('open', id => {
    const displayId = /^\d{6}$/.test(id) ? id : customId;
    localStorage.setItem('myPeerId', displayId);
    document.getElementById('myIdVal').textContent = displayId.slice(0,3) + ' ' + displayId.slice(3);
    setStatus('dot-green', 'Готово — ждём звонка');
    document.getElementById('callBtn').disabled =
      document.getElementById('callInput').value.trim().length < 6;
    console.log('[PeerJS] ✅ Подключён к серверу. Мой ID:', id, '| отображаемый:', displayId);
    console.log('[PeerJS] Peer.js сервер:', peer.options?.host || '0.peerjs.com (по умолчанию)');
  });

  peer.on('call', call => {
    incomingCall = call;
    console.log('[PeerJS] 📞 Входящий звонок от:', call.peer);
    document.getElementById('incomingId').textContent = call.peer;
    document.getElementById('screen-incoming').classList.add('show');
  });

  peer.on('connection', conn => {
    console.log('[PeerJS] 🔗 Входящее data-соединение от:', conn.peer);
    setupDataConn(conn);
  });

  peer.on('disconnected', () => {
    console.warn('[PeerJS] ⚠️ Отключён от сигнального сервера. Переподключение...');
    setStatus('dot-yellow', 'Переподключение…');
    setTimeout(() => { try { peer.reconnect(); } catch(e){ console.error('[PeerJS] reconnect() error:', e); } }, 2000);
  });

  peer.on('close', () => {
    console.warn('[PeerJS] Peer закрыт (destroyed).');
  });

  peer.on('error', e => {
    console.error('[PeerJS] ❌ Ошибка. type:', e.type, '| message:', e.message, '| объект:', e);
    // Расшифровка типичных ошибок
    const hints = {
      'peer-unavailable':   '→ Пир с таким ID не найден на сервере. Проверь: он онлайн? ID совпадает?',
      'not-open-yet':       '→ Peer ещё не подключился к серверу. Подожди open.',
      'disconnected':       '→ Peer отключён от сигнального сервера.',
      'invalid-id':         '→ Невалидный формат ID.',
      'invalid-key':        '→ Неверный API-ключ PeerJS.',
      'network':            '→ Сетевая ошибка — нет доступа к серверу PeerJS.',
      'server-error':       '→ Ошибка сигнального сервера PeerJS.',
      'socket-error':       '→ Ошибка WebSocket соединения.',
      'socket-closed':      '→ WebSocket закрылся неожиданно.',
      'unavailable-id':     '→ ID уже занят другим peer-ом.',
    };
    if (hints[e.type]) console.warn('[PeerJS] Подсказка:', hints[e.type]);

    if (e.type === 'unavailable-id') {
      const newId = make6digit();
      localStorage.setItem('myPeerId', newId);
      initPeer(newId);
    } else {
      setStatus('dot-red', 'Ошибка: ' + e.message);
    }
  });
}

// ════════════════════════════════════════
//  ПОЛУЧИТЬ ПОТОК КАМЕРЫ
// ════════════════════════════════════════
async function getLocalStream(facing) {
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
  }
  localStream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: facing || facingMode,
      width: { ideal: 640, max: 1280 },
      height: { ideal: 480, max: 720 },
      frameRate: { ideal: 20, max: 30 }
    },
    audio: {
      echoCancellation: true,
      noiseSuppression: true,
      autoGainControl: true
    }
  });
  document.getElementById('localVideo').srcObject = localStream;
  return localStream;
}

// ════════════════════════════════════════
//  ИСХОДЯЩИЙ ЗВОНОК
// ════════════════════════════════════════
async function startCall() {
  const peerId = document.getElementById('callInput').value.trim();
  // Убираем toUpperCase — ID состоит из цифр, регистр не нужен
  if (!peerId || peerId.length < 6) return;

  console.log('[Call] 📲 Исходящий звонок → peer ID:', peerId);
  console.log('[Call] Мой peer ID:', peer.id, '| peer.open:', peer.open, '| peer.disconnected:', peer.disconnected);

  setStatus('dot-yellow', 'Запрашиваем камеру…');
  try {
    await getLocalStream();
    console.log('[Call] ✅ Камера/микрофон получены. Треков:', localStream.getTracks().length);
  } catch(e) {
    console.error('[Call] ❌ getUserMedia упал:', e.name, e.message);
    setStatus('dot-red', 'Нет доступа к камере/микрофону');
    return;
  }

  setStatus('dot-yellow', 'Звоним…');
  const call = peer.call(peerId, localStream, {
    constraints: { iceServers: ICE_SERVERS }
  });
  console.log('[Call] peer.call() вызван. Объект call:', call);
  const conn = peer.connect(peerId, { reliable: true });
  setupDataConn(conn);
  handleCall(call);
}

// ════════════════════════════════════════
//  ПРИНЯТЬ / ОТКЛОНИТЬ ВХОДЯЩИЙ
// ════════════════════════════════════════
async function acceptCall() {
  document.getElementById('screen-incoming').classList.remove('show');
  try {
    await getLocalStream();
  } catch(e) {
    setStatus('dot-red', 'Нет доступа к камере/микрофону');
    incomingCall = null; return;
  }
  incomingCall.answer(localStream);
  handleCall(incomingCall);
  incomingCall = null;
}

function rejectCall() {
  document.getElementById('screen-incoming').classList.remove('show');
  if (incomingCall) { incomingCall.close(); incomingCall = null; }
}

// ════════════════════════════════════════
//  ОБРАБОТКА ЗВОНКА (общая)
// ════════════════════════════════════════
function handleCall(call) {
  currentCall = call;
  console.log('[handleCall] Обработка звонка. call.peer:', call?.peer);

  call.on('stream', remoteStream => {
    console.log('[handleCall] ✅ Получен remoteStream. Треков:', remoteStream.getTracks().length);
    document.getElementById('remoteVideo').srcObject = remoteStream;
    showCallScreen();
    startTimer();
    limitBandwidth(call.peerConnection);
    startQualityMonitor(call.peerConnection);
    currentPc = call.peerConnection;
  });

  call.on('close', () => {
    console.log('[handleCall] Звонок закрыт (close).');
    cleanupCall();
  });

  call.on('error', (err) => {
    console.error('[handleCall] Ошибка звонка:', err);
    cleanupCall();
  });

  // Диагностика ICE — ждём тик, т.к. для исходящего звонка peerConnection
  // создаётся не сразу, а после первого negotiation
  function attachIceListeners() {
    const pc = call.peerConnection;
    if (!pc) {
      console.warn('[ICE] peerConnection ещё null, повтор через 200ms...');
      setTimeout(attachIceListeners, 200);
      return;
    }
    console.log('[ICE] ✅ peerConnection получен. signalingState:', pc.signalingState);
    (() => {
    pc.onicecandidate = e => {
      if (e.candidate) {
        console.log('[ICE] Новый кандидат:', e.candidate.type, e.candidate.address || '(адрес скрыт)', e.candidate.protocol);
      } else {
        console.log('[ICE] Сбор кандидатов завершён (null candidate).');
      }
    };
    pc.onicegatheringstatechange = () => {
      console.log('[ICE] gatheringState →', pc.iceGatheringState);
    };
    pc.oniceconnectionstatechange = () => {
      const s = pc.iceConnectionState;
      console.log('[ICE] connectionState →', s);
      if (s === 'failed') {
        console.error('[ICE] ❌ ICE FAILED — соединение не установлено. Возможные причины:',
          '\n  1. Оба пира за симметричным NAT (нужен TURN)',
          '\n  2. TURN-сервер openrelay.metered.ca недоступен или заблокирован',
          '\n  3. Firewall блокирует UDP/TCP для медиа');
        setStatus('dot-red', 'ICE failed — нет p2p маршрута');
      }
      if (s === 'disconnected') {
        console.warn('[ICE] ⚠️ ICE disconnected — связь прервалась');
      }
    };
    pc.onconnectionstatechange = () => {
      console.log('[RTCPeer] connectionState →', pc.connectionState);
    };
    pc.onsignalingstatechange = () => {
      console.log('[RTCPeer] signalingState →', pc.signalingState);
    };
  })();
}

// ════════════════════════════════════════
//  ОГРАНИЧЕНИЕ БИТРЕЙТА (адаптация)
// ════════════════════════════════════════
function limitBandwidth(pc) {
  if (!pc) return;
  pc.getSenders().forEach(sender => {
    if (!sender.track) return;
    const params = sender.getParameters();
    if (!params.encodings || params.encodings.length === 0)
      params.encodings = [{}];
    if (sender.track.kind === 'video') {
      params.encodings[0].maxBitrate = 500_000;
    } else if (sender.track.kind === 'audio') {
      params.encodings[0].maxBitrate = 40_000;
    }
    sender.setParameters(params).catch(() => {});
  });
}

// ════════════════════════════════════════
//  МОНИТОРИНГ КАЧЕСТВА
// ════════════════════════════════════════
let lastPacketsLost = 0, lastPacketsReceived = 0;

function startQualityMonitor(pc) {
  stopQualityMonitor();
  statsInterval = setInterval(async () => {
    if (!pc) return;
    try {
      const stats = await pc.getStats();
      stats.forEach(r => {
        if (r.type === 'inbound-rtp' && r.kind === 'video') {
          const lost = (r.packetsLost || 0) - lastPacketsLost;
          const recv = (r.packetsReceived || 0) - lastPacketsReceived;
          lastPacketsLost = r.packetsLost || 0;
          lastPacketsReceived = r.packetsReceived || 0;
          const total = lost + recv;
          const lossRate = total > 0 ? lost / total : 0;
          updateQuality(lossRate);
        }
      });
    } catch(e) {}
  }, 5000);
}

function stopQualityMonitor() {
  if (statsInterval) { clearInterval(statsInterval); statsInterval = null; }
  lastPacketsLost = 0; lastPacketsReceived = 0;
}

function updateQuality(lossRate) {
  const dot = document.getElementById('qualityDot');
  const txt = document.getElementById('qualityText');
  const banner = document.getElementById('weakBanner');

  if (lossRate > 0.10) {
    dot.style.background = 'var(--red)';
    txt.textContent = 'плохое';
    banner.classList.add('show');
    if (videoOn) autoDisableVideo();
  } else if (lossRate > 0.03) {
    dot.style.background = 'var(--yellow)';
    txt.textContent = 'среднее';
    banner.classList.remove('show');
  } else {
    dot.style.background = 'var(--green)';
    txt.textContent = 'хорошее';
    banner.classList.remove('show');
  }
}

function autoDisableVideo() {
  if (!localStream) return;
  localStream.getVideoTracks().forEach(t => { t.enabled = false; });
  videoOn = false;
  document.getElementById('btnVideo').classList.add('off');
  document.getElementById('noVideoOverlay').classList.add('show');
}

// ════════════════════════════════════════
//  КНОПКИ УПРАВЛЕНИЯ
// ════════════════════════════════════════
function toggleMic() {
  if (!localStream) return;
  micOn = !micOn;
  localStream.getAudioTracks().forEach(t => { t.enabled = micOn; });
  document.getElementById('btnMic').classList.toggle('off', !micOn);
}

function toggleVideo() {
  if (!localStream) return;
  videoOn = !videoOn;
  localStream.getVideoTracks().forEach(t => { t.enabled = videoOn; });
  document.getElementById('btnVideo').classList.toggle('off', !videoOn);
  document.getElementById('noVideoOverlay').classList.toggle('show', !videoOn);
  document.getElementById('weakBanner').classList.remove('show');
}

async function switchCamera() {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  try {
    const newStream = await getLocalStream(facingMode);
    if (currentCall && currentCall.peerConnection) {
      const videoTrack = newStream.getVideoTracks()[0];
      const sender = currentCall.peerConnection.getSenders()
        .find(s => s.track && s.track.kind === 'video');
      if (sender && videoTrack) sender.replaceTrack(videoTrack);
    }
  } catch(e) { facingMode = facingMode === 'user' ? 'environment' : 'user'; }
}

function toggleChat() {
  chatOpen = !chatOpen;
  document.getElementById('chatPanel').classList.toggle('chat-hidden', !chatOpen);
  document.getElementById('btnChat').classList.toggle('off', !chatOpen);
  if (chatOpen) {
    document.getElementById('chatBadge').classList.remove('show');
    document.getElementById('chatInput').focus();
  }
}

function endCall() {
  if (currentCall) { currentCall.close(); }
  cleanupCall();
}

// ════════════════════════════════════════
//  ЧАТ
// ════════════════════════════════════════
function setupDataConn(conn) {
  dataConn = conn;
  conn.on('data', data => {
    addChatMsg(data, 'them');
    if (!chatOpen) document.getElementById('chatBadge').classList.add('show');
  });
  conn.on('error', () => {});
}

function sendChatMsg() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  if (dataConn && dataConn.open) {
    dataConn.send(text);
    addChatMsg(text, 'me');
    input.value = '';
  }
}

function addChatMsg(text, from) {
  const box = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'chat-msg ' + from;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

// ════════════════════════════════════════
//  ТАЙМЕР
// ════════════════════════════════════════
function startTimer() {
  callSeconds = 0;
  timerInterval = setInterval(() => {
    callSeconds++;
    const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
    const s = String(callSeconds % 60).padStart(2, '0');
    document.getElementById('callTimer').textContent = m + ':' + s;
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  document.getElementById('callTimer').textContent = '00:00';
}

// ════════════════════════════════════════
//  ПОКАЗАТЬ / СКРЫТЬ ЭКРАНЫ
// ════════════════════════════════════════
function showCallScreen() {
  document.getElementById('screen-wait').style.display = 'none';
  document.getElementById('screen-call').classList.add('show');
  setStatus('dot-green', 'Соединение установлено');
}

function cleanupCall() {
  stopQualityMonitor();
  stopTimer();

  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }

  document.getElementById('remoteVideo').srcObject = null;
  document.getElementById('localVideo').srcObject = null;
  document.getElementById('screen-call').classList.remove('show');
  document.getElementById('screen-wait').style.display = 'flex';
  document.getElementById('noVideoOverlay').classList.remove('show');
  document.getElementById('weakBanner').classList.remove('show');
  document.getElementById('chatPanel').classList.add('chat-hidden');
  document.getElementById('chatMessages').innerHTML = '';
  document.getElementById('chatBadge').classList.remove('show');

  micOn = true; videoOn = true; chatOpen = false;
  document.getElementById('btnMic').classList.remove('off');
  document.getElementById('btnVideo').classList.remove('off');
  document.getElementById('btnChat').classList.remove('off');
  document.getElementById('qualityDot').style.background = 'var(--green)';
  document.getElementById('qualityText').textContent = 'хорошее';

  currentCall = null; dataConn = null; currentPc = null;
  setStatus('dot-green', 'Готово — ждём звонка');
}

// ════════════════════════════════════════
//  КОПИРОВАТЬ КОД
// ════════════════════════════════════════
function copyId() {
  const id = document.getElementById('myIdVal').textContent;
  if (!id || id === '——') return;
  navigator.clipboard.writeText(id).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ Скопировано';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Копировать';
      btn.classList.remove('copied');
    }, 2000);
  });
}

// ════════════════════════════════════════
//  СТАТУС
// ════════════════════════════════════════
function setStatus(cls, text) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot';
  if (cls === 'dot-green') dot.classList.add('green');
  else if (cls === 'dot-yellow') dot.classList.add('yellow');
  else if (cls === 'dot-red') dot.classList.add('red');
  document.getElementById('statusText').textContent = text;
}

// ════════════════════════════════════════
//  ПЕРЕТАСКИВАНИЕ PiP
// ════════════════════════════════════════
function setupPipDrag() {
  const pip = document.getElementById('pipWrap');
  let dragging = false, ox = 0, oy = 0;

  pip.addEventListener('pointerdown', e => {
    dragging = true;
    pip.setPointerCapture(e.pointerId);
    const r = pip.getBoundingClientRect();
    ox = e.clientX - r.left;
    oy = e.clientY - r.top;
    pip.style.transition = 'none';
    e.preventDefault();
  });

  pip.addEventListener('pointermove', e => {
    if (!dragging) return;
    const parent = pip.parentElement.getBoundingClientRect();
    let x = e.clientX - parent.left - ox;
    let y = e.clientY - parent.top - oy;
    x = Math.max(8, Math.min(parent.width - pip.offsetWidth - 8, x));
    y = Math.max(8, Math.min(parent.height - pip.offsetHeight - 8, y));
    pip.style.right = 'auto';
    pip.style.bottom = 'auto';
    pip.style.left = x + 'px';
    pip.style.top = y + 'px';
  });

  pip.addEventListener('pointerup', () => { dragging = false; });
}
