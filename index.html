<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ВидеоСвязь — простой звонок</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0a0f1e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: #111827;
            border-radius: 2rem;
            padding: 1.5rem;
            border: 1px solid #1f2a3e;
            box-shadow: 0 25px 50px -12px black;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            text-align: center;
            background: linear-gradient(135deg, #c084fc, #60a5fa);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .sub {
            text-align: center;
            color: #8b9bcf;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .card {
            background: #0f172a;
            border-radius: 1.2rem;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            border: 1px solid #1e2a44;
        }

        .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #7e8bb6;
            margin-bottom: 8px;
        }

        .my-id-box {
            background: #020617;
            border-radius: 1rem;
            padding: 12px;
            font-family: monospace;
            font-size: 0.9rem;
            word-break: break-all;
            text-align: center;
            color: #facc15;
            border: 1px solid #334155;
            margin-bottom: 10px;
        }

        .copy-btn {
            background: #1e293b;
            border: none;
            border-radius: 40px;
            padding: 8px 16px;
            color: white;
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .copy-btn:active { background: #3b82f6; }
        .copy-btn.copied { background: #10b981; }

        .status {
            background: #1e1b4b;
            border-radius: 40px;
            padding: 8px 12px;
            font-size: 0.75rem;
            text-align: center;
            margin-top: 12px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .green { background: #10b981; box-shadow: 0 0 5px #10b981; }
        .yellow { background: #f59e0b; animation: pulse 1s infinite; }
        .red { background: #ef4444; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin: 12px 0;
        }

        input {
            flex: 1;
            background: #020617;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 60px;
            font-size: 0.85rem;
            font-family: monospace;
            color: white;
            outline: none;
        }

        input:focus { border-color: #3b82f6; }

        button {
            background: #3b82f6;
            border: none;
            padding: 0 20px;
            border-radius: 60px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:active { transform: scale(0.96); }

        .call-btn {
            background: #10b981;
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            margin-top: 8px;
        }

        .hangup-btn {
            background: #dc2626;
            width: 100%;
            padding: 12px;
            margin-top: 12px;
        }

        .video-area {
            display: none;
            margin-bottom: 1rem;
        }

        .video-wrapper {
            background: #020617;
            border-radius: 1rem;
            overflow: hidden;
            position: relative;
            aspect-ratio: 16 / 9;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .local-small {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 100px;
            border-radius: 12px;
            border: 2px solid #1e2a44;
            background: black;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 12px;
        }

        .ctrl {
            background: #1e293b;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            border: none;
            color: white;
            cursor: pointer;
        }

        .ctrl.off { opacity: 0.5; background: #4a1a2a; }

        .warning {
            background: #7c2d12;
            color: #fed7aa;
            border-radius: 20px;
            padding: 8px;
            font-size: 0.7rem;
            text-align: center;
            margin-top: 12px;
            display: none;
        }

        .footer {
            font-size: 0.6rem;
            text-align: center;
            color: #475569;
            margin-top: 1rem;
        }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
<div class="container">
    <h1>📞 ВидеоСвязь</h1>
    <div class="sub">простой и безопасный звонок</div>

    <div class="card">
        <div class="label">🔑 ТВОЙ УНИКАЛЬНЫЙ ID</div>
        <div class="my-id-box" id="myIdBox">— подключаемся —</div>
        <button class="copy-btn" id="copyBtn">📋 Копировать ID</button>
        <div class="status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Подключение к сети...</span>
        </div>
    </div>

    <div class="video-area" id="videoArea">
        <div class="video-wrapper">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted class="local-small"></video>
        </div>
        <div class="controls">
            <button class="ctrl" id="toggleMicBtn">🎤 Микрофон</button>
            <button class="ctrl" id="toggleVideoBtn">📷 Видео</button>
        </div>
        <button class="hangup-btn" id="hangupBtn">⛔ Завершить звонок</button>
    </div>

    <div class="card">
        <div class="label">📞 ПОЗВОНИТЬ</div>
        <div class="input-group">
            <input type="text" id="remoteIdInput" placeholder="Вставь ID собеседника">
            <button id="callBtn">▶️ Звонок</button>
        </div>
        <div class="warning" id="callWarning"></div>
    </div>

    <div class="footer">
        🔒 Прямое P2P соединение • Никакие данные не хранятся<br>
        📋 Скопируй свой ID и отправь его собеседнику
    </div>
</div>

<script>
    // ════════════════════════════════════════
    //  КОНФИГУРАЦИЯ (публичные серверы PeerJS)
    // ════════════════════════════════════════
    const PEER_SERVERS = [
        { host: '0.peerjs.com', port: 443, secure: true },
        { host: '1.peerjs.com', port: 443, secure: true },
        { host: 'eu0.peerjs.com', port: 443, secure: true }
    ];

    // STUN/TURN серверы для обхода NAT
    const ICE_SERVERS = [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
    ];

    // ════════════════════════════════════════
    //  СОСТОЯНИЕ
    // ════════════════════════════════════════
    let peer = null;
    let currentCall = null;
    let localStream = null;
    let currentServerIndex = 0;
    let micEnabled = true;
    let videoEnabled = true;

    // DOM элементы
    const myIdBox = document.getElementById('myIdBox');
    const copyBtn = document.getElementById('copyBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const remoteIdInput = document.getElementById('remoteIdInput');
    const callBtn = document.getElementById('callBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const videoArea = document.getElementById('videoArea');
    const remoteVideo = document.getElementById('remoteVideo');
    const localVideo = document.getElementById('localVideo');
    const toggleMicBtn = document.getElementById('toggleMicBtn');
    const toggleVideoBtn = document.getElementById('toggleVideoBtn');
    const callWarning = document.getElementById('callWarning');

    // ════════════════════════════════════════
    //  ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ════════════════════════════════════════
    function setStatus(color, text) {
        statusDot.className = `status-dot ${color}`;
        statusText.textContent = text;
    }

    function showWarning(msg, isError = true) {
        callWarning.textContent = msg;
        callWarning.style.display = 'block';
        if (isError) {
            setTimeout(() => { callWarning.style.display = 'none'; }, 5000);
        }
    }

    // ════════════════════════════════════════
    //  ПОЛУЧЕНИЕ МЕДИА
    // ════════════════════════════════════════
    async function getLocalStream() {
        if (localStream) {
            localStream.getTracks().forEach(t => t.stop());
        }
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 15 } },
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
            });
            localStream = stream;
            localVideo.srcObject = stream;
            return stream;
        } catch (err) {
            console.error('getUserMedia error:', err);
            setStatus('red', 'Нет доступа к камере/микрофону');
            throw err;
        }
    }

    // ════════════════════════════════════════
    //  СОЗДАНИЕ PEER С ПЕРЕКЛЮЧЕНИЕМ СЕРВЕРОВ
    // ════════════════════════════════════════
    function createPeer() {
        if (peer && !peer.destroyed) {
            try { peer.destroy(); } catch(e) {}
        }

        const config = PEER_SERVERS[currentServerIndex];
        console.log(`[Peer] Подключение к ${config.host}`);

        setStatus('yellow', `Подключение к ${config.host}...`);

        const newPeer = new Peer({
            host: config.host,
            port: config.port,
            path: '/',
            secure: config.secure,
            config: { iceServers: ICE_SERVERS },
            debug: 0,
            pingInterval: 30000,
            reconnect: true,
            reconnectAttempts: 5,
            reconnectDelay: 2000
        });

        newPeer.on('open', (id) => {
            console.log(`[Peer] ✅ Подключён! ID: ${id}`);
            myIdBox.textContent = id;
            setStatus('green', 'Онлайн — можно звонить');
            copyBtn.disabled = false;
            callBtn.disabled = false;
        });

        newPeer.on('call', async (incomingCall) => {
            console.log(`[Peer] 📞 Входящий звонок от ${incomingCall.peer}`);
            
            if (currentCall) {
                console.log('[Peer] Уже в звонке, отклоняем');
                incomingCall.close();
                return;
            }

            // Спрашиваем разрешение на ответ
            const accept = confirm(`Входящий звонок от ${incomingCall.peer.slice(0, 8)}...\nПринять?`);
            if (!accept) {
                incomingCall.close();
                return;
            }

            try {
                await getLocalStream();
                incomingCall.answer(localStream);
                setupCallEvents(incomingCall);
                currentCall = incomingCall;
                showVideoUI(true);
                showWarning('', false);
            } catch (err) {
                console.error('Ошибка при ответе:', err);
                showWarning('Не удалось получить доступ к камере');
                incomingCall.close();
            }
        });

        newPeer.on('error', (err) => {
            console.error(`[Peer] Ошибка (${config.host}):`, err.type);
            
            if (err.type === 'network' || err.type === 'server-error' || 
                err.type === 'socket-error' || err.type === 'disconnected') {
                
                // Переключаемся на следующий сервер
                if (currentServerIndex + 1 < PEER_SERVERS.length) {
                    currentServerIndex++;
                    console.log(`[Peer] Переключение на ${PEER_SERVERS[currentServerIndex].host}`);
                    setStatus('yellow', `Переключение на ${PEER_SERVERS[currentServerIndex].host}...`);
                    createPeer();
                } else {
                    setStatus('red', 'Все серверы недоступны. Обнови страницу.');
                }
            } else if (err.type === 'unavailable-id') {
                // ID занят? Просто пересоздаём
                console.log('[Peer] ID конфликт, пересоздаём');
                setTimeout(() => createPeer(), 1000);
            }
        });

        newPeer.on('disconnected', () => {
            console.log('[Peer] Отключён, пробуем reconnect');
            setStatus('yellow', 'Потеря связи, переподключение...');
            if (!newPeer.destroyed) {
                newPeer.reconnect();
            }
        });

        newPeer.on('close', () => {
            console.log('[Peer] Закрыт');
            if (!newPeer.destroyed) {
                setTimeout(() => createPeer(), 3000);
            }
        });

        peer = newPeer;
        return newPeer;
    }

    // ════════════════════════════════════════
    //  НАСТРОЙКА СОБЫТИЙ ЗВОНКА
    // ════════════════════════════════════════
    function setupCallEvents(call) {
        call.on('stream', (remoteStream) => {
            console.log('[Call] Получен поток от', call.peer);
            remoteVideo.srcObject = remoteStream;
            showWarning('', false);
        });

        call.on('close', () => {
            console.log('[Call] Звонок завершён');
            cleanupCall();
        });

        call.on('error', (err) => {
            console.error('[Call] Ошибка:', err);
            showWarning('Ошибка соединения, звонок завершён');
            cleanupCall();
        });

        // Мониторинг ICE
        const pc = call.peerConnection;
        if (pc) {
            pc.oniceconnectionstatechange = () => {
                const state = pc.iceConnectionState;
                console.log('[ICE] Состояние:', state);
                if (state === 'failed') {
                    showWarning('Соединение потеряно. Попробуйте перезвонить.');
                    cleanupCall();
                }
            };
        }
    }

    // ════════════════════════════════════════
    //  ИСХОДЯЩИЙ ЗВОНОК
    // ════════════════════════════════════════
    async function startCall() {
        const remoteId = remoteIdInput.value.trim();
        if (!remoteId) {
            showWarning('Введите ID собеседника');
            return;
        }

        if (!peer || peer.destroyed) {
            showWarning('Подключение к серверу не установлено');
            return;
        }

        if (currentCall) {
            showWarning('Вы уже в звонке. Сначала завершите текущий звонок.');
            return;
        }

        setStatus('yellow', 'Звонок...');
        showWarning('', false);

        try {
            await getLocalStream();
            
            const call = peer.call(remoteId, localStream);
            setupCallEvents(call);
            currentCall = call;
            showVideoUI(true);
            
            console.log('[Call] Звонок на', remoteId);
        } catch (err) {
            console.error('Ошибка звонка:', err);
            setStatus('red', 'Ошибка звонка');
            showWarning('Не удалось начать звонок. Проверьте ID и повторите.');
        }
    }

    // ════════════════════════════════════════
    //  ЗАВЕРШЕНИЕ ЗВОНКА
    // ════════════════════════════════════════
    function cleanupCall() {
        if (currentCall) {
            try { currentCall.close(); } catch(e) {}
            currentCall = null;
        }
        
        showVideoUI(false);
        
        // Не останавливаем localStream — оставляем для следующего звонка
        if (remoteVideo.srcObject) {
            remoteVideo.srcObject = null;
        }
        
        setStatus('green', 'Готов к звонкам');
    }

    function endCall() {
        cleanupCall();
    }

    // ════════════════════════════════════════
    //  ИНТЕРФЕЙС
    // ════════════════════════════════════════
    function showVideoUI(show) {
        if (show && localStream) {
            videoArea.style.display = 'block';
            hangupBtn.style.display = 'block';
            callBtn.textContent = '📞 В звонке';
            callBtn.disabled = true;
            setStatus('green', 'В разговоре');
        } else {
            videoArea.style.display = 'none';
            hangupBtn.style.display = 'none';
            callBtn.textContent = '▶️ Звонок';
            callBtn.disabled = false;
            setStatus('green', 'Готов к звонкам');
        }
    }

    function toggleMic() {
        if (!localStream) return;
        micEnabled = !micEnabled;
        localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
        toggleMicBtn.classList.toggle('off', !micEnabled);
        toggleMicBtn.textContent = micEnabled ? '🎤 Микрофон' : '🔇 Микрофон выкл';
    }

    function toggleVideo() {
        if (!localStream) return;
        videoEnabled = !videoEnabled;
        localStream.getVideoTracks().forEach(t => t.enabled = videoEnabled);
        toggleVideoBtn.classList.toggle('off', !videoEnabled);
        toggleVideoBtn.textContent = videoEnabled ? '📷 Видео' : '📷 Видео выкл';
    }

    function copyId() {
        const id = myIdBox.textContent;
        if (!id || id === '— подключаемся —') return;
        
        navigator.clipboard.writeText(id).then(() => {
            copyBtn.textContent = '✓ Скопировано!';
            copyBtn.classList.add('copied');
            setTimeout(() => {
                copyBtn.textContent = '📋 Копировать ID';
                copyBtn.classList.remove('copied');
            }, 2000);
        }).catch(() => {
            showWarning('Не удалось скопировать');
        });
    }

    // ════════════════════════════════════════
    //  ИНИЦИАЛИЗАЦИЯ
    // ════════════════════════════════════════
    window.addEventListener('load', () => {
        createPeer();
        
        callBtn.onclick = startCall;
        hangupBtn.onclick = endCall;
        copyBtn.onclick = copyId;
        toggleMicBtn.onclick = toggleMic;
        toggleVideoBtn.onclick = toggleVideo;
        
        // Предзапрашиваем камеру (по желанию пользователя)
        // Но лучше спросить при звонке, чтобы не пугать разрешением сразу
    });
</script>
</body>
</html>
