<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ВидеоСвязь — звонок по коду</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --bg2: #12121a;
    --bg3: #1a1a26;
    --border: rgba(255,255,255,0.1);
    --text: #e8e8f0;
    --text2: #8888a8;
    --green: #2ecc71;
    --yellow: #f1c40f;
    --red: #e74c3c;
    --blue: #3b82f6;
    --blue2: #1d4ed8;
    --radius: 14px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #screen-wait {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 24px;
  }

  .app-title { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .app-sub { font-size: 14px; color: var(--text2); margin-bottom: 32px; }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-width: 380px;
  }

  .card-label {
    font-size: 12px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
  }

  .my-id-box {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 12px;
  }

  .my-id-val {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 5px;
    color: #7dd3fc;
    font-family: 'Courier New', monospace;
  }

  .copy-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
  }
  .copy-btn.copied { color: var(--green); border-color: var(--green); }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 20px 0;
  }

  .input-wrap { margin-bottom: 12px; }
  .input-wrap input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    color: var(--text);
    font-size: 22px;
    font-family: 'Courier New', monospace;
    letter-spacing: 6px;
    text-align: center;
    outline: none;
  }
  .input-wrap input:focus { border-color: var(--blue); }

  .btn-primary {
    width: 100%;
    background: var(--blue);
    border: none;
    border-radius: 10px;
    padding: 14px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary:disabled { background: var(--bg3); color: var(--text2); cursor: not-allowed; }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 16px;
    font-size: 13px;
    color: var(--text2);
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .status-dot.green { background: var(--green); }
  .status-dot.yellow { background: var(--yellow); animation: pulse 1.2s infinite; }
  .status-dot.red { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  #screen-incoming {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 24px;
  }
  #screen-incoming.show { display: flex; }

  .incoming-avatar {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: var(--bg3);
    border: 3px solid var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    animation: ring 1.2s infinite;
  }
  @keyframes ring {
    0%,100%{ box-shadow: 0 0 0 0 rgba(46,204,113,0.5); }
    50%{ box-shadow: 0 0 0 20px rgba(46,204,113,0); }
  }

  .incoming-title { font-size: 20px; font-weight: 600; }
  .incoming-sub { font-size: 14px; color: var(--text2); font-family: monospace; }

  .incoming-btns { display: flex; gap: 24px; margin-top: 8px; }
  .btn-accept, .btn-reject {
    width: 68px; height: 68px;
    border-radius: 50%;
    border: none;
    font-size: 26px;
    cursor: pointer;
  }
  .btn-accept { background: var(--green); }
  .btn-reject { background: var(--red); }

  #screen-call {
    display: none;
    position: fixed; inset: 0;
    background: #000;
    flex-direction: column;
  }
  #screen-call.show { display: flex; }

  .video-wrap {
    flex: 1;
    position: relative;
    background: #000;
  }
  #remoteVideo {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .pip-wrap {
    position: absolute;
    bottom: 16px; right: 16px;
    width: 110px; height: 82px;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.25);
    cursor: grab;
    z-index: 10;
  }
  #localVideo {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  .call-overlay {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 16px;
    display: flex;
    justify-content: space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, transparent 100%);
    pointer-events: none;
    z-index: 5;
  }
  .call-timer { font-size: 16px; font-weight: 500; color: #fff; }
  .quality-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,0,0,0.45);
    border-radius: 20px;
    padding: 5px 11px;
    font-size: 12px;
    color: #fff;
  }
  .q-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
  }
  .no-video-overlay {
    position: absolute; inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: var(--bg);
    z-index: 4;
  }
  .no-video-overlay.show { display: flex; }
  .weak-banner {
    position: absolute;
    top: 60px; left: 50%;
    transform: translateX(-50%);
    background: rgba(241,196,15,0.9);
    color: #000;
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    display: none;
    z-index: 9;
  }
  .weak-banner.show { display: block; }

  .controls-bar {
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(12px);
    padding: 14px 20px 20px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    z-index: 10;
  }
  .ctrl {
    width: 54px; height: 54px;
    border-radius: 50%;
    border: none;
    font-size: 22px;
    cursor: pointer;
    background: rgba(255,255,255,0.12);
    color: #fff;
  }
  .ctrl.off { opacity: 0.5; background: #4a1a2a; }
  .ctrl.end { background: var(--red); width: 64px; height: 64px; font-size: 26px; }

  .chat-panel {
    position: absolute;
    bottom: 90px; left: 0; right: 0;
    max-height: 220px;
    display: flex;
    flex-direction: column;
    z-index: 8;
  }
  .chat-hidden { display: none !important; }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 8px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .chat-msg {
    max-width: 75%;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 14px;
  }
  .chat-msg.me {
    align-self: flex-end;
    background: var(--blue);
    color: #fff;
  }
  .chat-msg.them {
    align-self: flex-start;
    background: rgba(255,255,255,0.15);
    color: var(--text);
  }
  .chat-input-row {
    display: flex;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(0,0,0,0.5);
  }
  .chat-input-row input {
    flex: 1;
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 9px 16px;
    color: var(--text);
    outline: none;
  }
  .chat-send {
    background: var(--blue);
    border: none;
    border-radius: 50%;
    width: 38px; height: 38px;
    font-size: 17px;
    cursor: pointer;
  }
  .ctrl-chat-wrap { position: relative; }
  .chat-badge {
    position: absolute;
    top: -4px; right: -4px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--red);
    font-size: 10px;
    color: #fff;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .chat-badge.show { display: flex; }
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

<div id="screen-wait">
  <div class="app-title">📞 ВидеоСвязь</div>
  <div class="app-sub">Безопасная связь без посредников</div>

  <div class="card">
    <div class="card-label">Твой код</div>
    <div class="my-id-box">
      <div class="my-id-val" id="myIdVal">——</div>
      <button class="copy-btn" id="copyBtn">Копировать</button>
    </div>
    <div style="font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:20px;">
      Сообщи этот код собеседнику.<br>
      Он <strong style="color:var(--text)">постоянный</strong> — не меняется при перезагрузке.
    </div>
    <div class="divider"></div>
    <div class="card-label">Позвонить</div>
    <div class="input-wrap">
      <input id="callInput" type="tel" inputmode="numeric" placeholder="Введи 6 цифр" maxlength="6" autocomplete="off">
    </div>
    <button class="btn-primary" id="callBtn" disabled>📞 Позвонить</button>
    <div class="status-row">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Подключение...</span>
    </div>
  </div>
</div>

<div id="screen-incoming">
  <div class="incoming-avatar">👤</div>
  <div class="incoming-title">Входящий звонок</div>
  <div class="incoming-sub" id="incomingId"></div>
  <div class="incoming-btns">
    <button class="btn-reject" id="rejectCallBtn">✕</button>
    <button class="btn-accept" id="acceptCallBtn">✓</button>
  </div>
</div>

<div id="screen-call">
  <div class="video-wrap">
    <video id="remoteVideo" autoplay playsinline></video>
    <div class="no-video-overlay" id="noVideoOverlay">
      <div class="icon">🎤</div>
      <p>Видео отключено — только аудио</p>
    </div>
    <div class="call-overlay">
      <div class="call-timer" id="callTimer">00:00</div>
      <div class="quality-badge">
        <div class="q-dot" id="qualityDot"></div>
        <span id="qualityText">хорошее</span>
      </div>
    </div>
    <div class="weak-banner" id="weakBanner">⚠ Слабый сигнал — видео отключено</div>
    <div class="pip-wrap" id="pipWrap">
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="pip-label">Я</div>
    </div>
  </div>
  <div class="chat-panel chat-hidden" id="chatPanel">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row">
      <input id="chatInput" type="text" placeholder="Сообщение…" maxlength="500">
      <button class="chat-send" id="chatSendBtn">➤</button>
    </div>
  </div>
  <div class="controls-bar">
    <button class="ctrl" id="btnMic" title="Микрофон">🎤</button>
    <button class="ctrl" id="btnVideo" title="Видео">📷</button>
    <button class="ctrl" id="btnCamera" title="Камера">🔄</button>
    <button class="ctrl end" id="endCallBtn" title="Завершить">📵</button>
    <div class="ctrl-chat-wrap">
      <button class="ctrl" id="btnChat" title="Чат">💬</button>
      <div class="chat-badge" id="chatBadge">!</div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  GOOGLE SHEETS URL (вставьте ваш)
// ═══════════════════════════════════════════════════════════════
const GOOGLE_SHEETS_URL = 'https://script.google.com/macros/s/AKfycbyUaHJ6qgeNfcISSbvAbnRzJ3BQuIdbcSSepUMtpt3ZXPxogXCw_iKB70ovqyspAW0cVQ/exec';

// ═══════════════════════════════════════════════════════════════
//  КОНФИГУРАЦИЯ PEERJS
// ═══════════════════════════════════════════════════════════════
const PEER_SERVERS = [
  { host: '0.peerjs.com', port: 443, secure: true },
  { host: '1.peerjs.com', port: 443, secure: true },
  { host: 'eu0.peerjs.com', port: 443, secure: true }
];

const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
];

// ═══════════════════════════════════════════════════════════════
//  ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ
// ═══════════════════════════════════════════════════════════════
let peer = null;
let currentCall = null;
let localStream = null;
let dataChannel = null;
let currentServerIndex = 0;
let myCode = null;
let myUUID = null;
let incomingCall = null;

let micEnabled = true;
let videoEnabled = true;
let chatOpen = false;
let callSeconds = 0;
let timerInterval = null;
let statsInterval = null;
let facingMode = 'user';
let lastLost = 0, lastRecv = 0;

// DOM элементы
const myIdVal = document.getElementById('myIdVal');
const copyBtn = document.getElementById('copyBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const callInput = document.getElementById('callInput');
const callBtn = document.getElementById('callBtn');
const screenWait = document.getElementById('screen-wait');
const screenCall = document.getElementById('screen-call');
const screenIncoming = document.getElementById('screen-incoming');
const incomingIdSpan = document.getElementById('incomingId');
const remoteVideo = document.getElementById('remoteVideo');
const localVideo = document.getElementById('localVideo');
const callTimer = document.getElementById('callTimer');
const qualityDot = document.getElementById('qualityDot');
const qualityText = document.getElementById('qualityText');
const weakBanner = document.getElementById('weakBanner');
const noVideoOverlay = document.getElementById('noVideoOverlay');
const btnMic = document.getElementById('btnMic');
const btnVideo = document.getElementById('btnVideo');
const btnCamera = document.getElementById('btnCamera');
const endCallBtn = document.getElementById('endCallBtn');
const btnChat = document.getElementById('btnChat');
const chatPanel = document.getElementById('chatPanel');
const chatMessages = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const chatSendBtn = document.getElementById('chatSendBtn');
const chatBadge = document.getElementById('chatBadge');

// ═══════════════════════════════════════════════════════════════
//  ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
// ═══════════════════════════════════════════════════════════════
function setStatus(color, text) {
  statusDot.className = 'status-dot';
  if (color === 'green') statusDot.classList.add('green');
  else if (color === 'yellow') statusDot.classList.add('yellow');
  else if (color === 'red') statusDot.classList.add('red');
  statusText.textContent = text;
}

function generateCode() {
  return String(Math.floor(100000 + Math.random() * 900000));
}

function showCode(code) {
  myIdVal.textContent = code.slice(0, 3) + ' ' + code.slice(3);
}

// ═══════════════════════════════════════════════════════════════
//  РЕГИСТРАЦИЯ КОДА В GOOGLE SHEETS
// ═══════════════════════════════════════════════════════════════
async function registerCode(code, uuid) {
  try {
    const response = await fetch(GOOGLE_SHEETS_URL, {
      method: 'POST',
      body: JSON.stringify({ code: code, uuid: uuid }),
      headers: { 'Content-Type': 'application/json' }
    });
    const result = await response.json();
    if (result.status === 'ok') {
      return code;
    } else {
      const newCode = generateCode();
      localStorage.setItem('myCode', newCode);
      showCode(newCode);
      return await registerCode(newCode, uuid);
    }
  } catch (err) {
    console.error('Ошибка регистрации:', err);
    const newCode = generateCode();
    localStorage.setItem('myCode', newCode);
    showCode(newCode);
    return await registerCode(newCode, uuid);
  }
}

// ═══════════════════════════════════════════════════════════════
//  ПОЛУЧЕНИЕ МЕДИА
// ═══════════════════════════════════════════════════════════════
async function getLocalStream() {
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 15 } },
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    localStream = stream;
    localVideo.srcObject = stream;
    return stream;
  } catch (err) {
    console.error('getUserMedia error:', err);
    setStatus('red', 'Нет доступа к камере/микрофону');
    throw err;
  }
}

// ═══════════════════════════════════════════════════════════════
//  СОЗДАНИЕ PEER
// ═══════════════════════════════════════════════════════════════
function createPeer() {
  if (peer && !peer.destroyed) {
    try { peer.destroy(); } catch(e) {}
  }

  const config = PEER_SERVERS[currentServerIndex];
  console.log(`[Peer] Подключение к ${config.host}`);
  setStatus('yellow', 'Подключение...');

  const newPeer = new Peer({
    host: config.host,
    port: config.port,
    path: '/',
    secure: config.secure,
    config: { iceServers: ICE_SERVERS },
    debug: 0,
    pingInterval: 30000,
    reconnect: true,
    reconnectAttempts: 3
  });

  newPeer.on('open', async (uuid) => {
    console.log(`[Peer] Подключён! UUID: ${uuid}`);
    myUUID = uuid;
    
    const savedCode = localStorage.getItem('myCode');
    if (savedCode) {
      myCode = savedCode;
      showCode(myCode);
      await registerCode(myCode, myUUID);
    } else {
      myCode = generateCode();
      localStorage.setItem('myCode', myCode);
      myCode = await registerCode(myCode, myUUID);
      showCode(myCode);
    }
    
    setStatus('green', 'Готов — можно звонить');
    callBtn.disabled = false;
  });

  newPeer.on('call', (call) => {
    console.log(`[Peer] Входящий звонок от ${call.peer}`);
    incomingCall = call;
    const callerCode = call.metadata?.code || '??????';
    incomingIdSpan.textContent = callerCode;
    screenIncoming.classList.add('show');
  });

  newPeer.on('connection', (conn) => {
    console.log('[Peer] Data channel');
    setupDataChannel(conn);
  });

  newPeer.on('error', (err) => {
    console.error(`[Peer] Ошибка (${config.host}):`, err.type);
    if (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error') {
      if (currentServerIndex + 1 < PEER_SERVERS.length) {
        currentServerIndex++;
        createPeer();
      } else {
        setStatus('red', 'Серверы недоступны. Обнови страницу.');
      }
    }
  });

  newPeer.on('disconnected', () => {
    console.log('[Peer] Отключён');
    setStatus('yellow', 'Переподключение...');
    if (!newPeer.destroyed) newPeer.reconnect();
  });

  peer = newPeer;
}

// ═══════════════════════════════════════════════════════════════
//  DATA CHANNEL (ЧАТ)
// ═══════════════════════════════════════════════════════════════
function setupDataChannel(conn) {
  dataChannel = conn;
  conn.on('data', (data) => {
    addChatMessage(data, 'them');
    if (!chatOpen) chatBadge.classList.add('show');
  });
}

function sendChatMessage() {
  const text = chatInput.value.trim();
  if (!text || !dataChannel || dataChannel.open !== true) return;
  dataChannel.send(text);
  addChatMessage(text, 'me');
  chatInput.value = '';
}

function addChatMessage(text, from) {
  const div = document.createElement('div');
  div.className = `chat-msg ${from}`;
  div.textContent = text;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

// ═══════════════════════════════════════════════════════════════
//  ЗВОНОК ПО КОДУ (через Google Sheets)
// ═══════════════════════════════════════════════════════════════
async function startCall() {
  const targetCode = callInput.value.trim();
  if (!targetCode || targetCode.length !== 6) return;
  
  setStatus('yellow', 'Поиск собеседника...');
  
  try {
    const response = await fetch(`${GOOGLE_SHEETS_URL}?code=${targetCode}`);
    const result = await response.json();
    
    if (result.status !== 'ok' || !result.uuid) {
      setStatus('red', 'Код не найден. Собеседник не онлайн.');
      return;
    }
    
    const targetUUID = result.uuid;
    console.log(`[Call] Найден UUID: ${targetUUID}`);
    
    setStatus('yellow', 'Запрашиваем камеру...');
    await getLocalStream();
    
    setStatus('yellow', 'Звонок...');
    const call = peer.call(targetUUID, localStream, { metadata: { code: myCode } });
    const conn = peer.connect(targetUUID, { metadata: { code: myCode } });
    setupDataChannel(conn);
    handleCall(call);
    
  } catch (err) {
    console.error('[Call] Ошибка:', err);
    setStatus('red', 'Ошибка при звонке');
  }
}

// ═══════════════════════════════════════════════════════════════
//  ОБРАБОТКА ЗВОНКА
// ═══════════════════════════════════════════════════════════════
function handleCall(call) {
  currentCall = call;
  
  call.on('stream', (remoteStream) => {
    console.log('[Call] Поток получен');
    remoteVideo.srcObject = remoteStream;
    showCallScreen();
    startTimer();
    startQualityMonitor(call.peerConnection);
  });
  
  call.on('close', () => cleanupCall());
  call.on('error', () => cleanupCall());
  
  const pc = call.peerConnection;
  if (pc) {
    pc.oniceconnectionstatechange = () => {
      if (pc.iceConnectionState === 'failed') cleanupCall();
    };
  }
}

async function acceptCall() {
  screenIncoming.classList.remove('show');
  try {
    await getLocalStream();
    incomingCall.answer(localStream);
    handleCall(incomingCall);
    incomingCall = null;
  } catch (err) {
    setStatus('red', 'Не удалось получить камеру');
    incomingCall = null;
  }
}

function rejectCall() {
  screenIncoming.classList.remove('show');
  if (incomingCall) {
    incomingCall.close();
    incomingCall = null;
  }
}

// ═══════════════════════════════════════════════════════════════
//  УПРАВЛЕНИЕ
// ═══════════════════════════════════════════════════════════════
function toggleMic() {
  if (!localStream) return;
  micEnabled = !micEnabled;
  localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
  btnMic.classList.toggle('off', !micEnabled);
}

function toggleVideo() {
  if (!localStream) return;
  videoEnabled = !videoEnabled;
  localStream.getVideoTracks().forEach(t => t.enabled = videoEnabled);
  btnVideo.classList.toggle('off', !videoEnabled);
  noVideoOverlay.classList.toggle('show', !videoEnabled);
  if (videoEnabled) weakBanner.classList.remove('show');
}

async function switchCamera() {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  try {
    const newStream = await getLocalStream();
    if (currentCall && currentCall.peerConnection) {
      const videoTrack = newStream.getVideoTracks()[0];
      const sender = currentCall.peerConnection.getSenders().find(s => s.track?.kind === 'video');
      if (sender && videoTrack) await sender.replaceTrack(videoTrack);
    }
  } catch (err) {
    facingMode = facingMode === 'user' ? 'environment' : 'user';
  }
}

function toggleChat() {
  chatOpen = !chatOpen;
  chatPanel.classList.toggle('chat-hidden', !chatOpen);
  btnChat.classList.toggle('off', !chatOpen);
  if (chatOpen) {
    chatBadge.classList.remove('show');
    chatInput.focus();
  }
}

function endCall() {
  if (currentCall) currentCall.close();
  cleanupCall();
}

function cleanupCall() {
  if (timerInterval) clearInterval(timerInterval);
  if (statsInterval) clearInterval(statsInterval);
  timerInterval = null;
  statsInterval = null;
  callSeconds = 0;
  callTimer.textContent = '00:00';
  lastLost = 0; lastRecv = 0;
  
  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }
  
  remoteVideo.srcObject = null;
  localVideo.srcObject = null;
  screenCall.classList.remove('show');
  screenWait.style.display = 'flex';
  noVideoOverlay.classList.remove('show');
  weakBanner.classList.remove('show');
  chatPanel.classList.add('chat-hidden');
  chatMessages.innerHTML = '';
  chatBadge.classList.remove('show');
  
  micEnabled = true;
  videoEnabled = true;
  chatOpen = false;
  btnMic.classList.remove('off');
  btnVideo.classList.remove('off');
  btnChat.classList.remove('off');
  qualityDot.style.background = 'var(--green)';
  qualityText.textContent = 'хорошее';
  
  currentCall = null;
  dataChannel = null;
  setStatus('green', 'Готов — можно звонить');
}

function showCallScreen() {
  screenWait.style.display = 'none';
  screenCall.classList.add('show');
  setStatus('green', 'В разговоре');
}

function startTimer() {
  callSeconds = 0;
  timerInterval = setInterval(() => {
    callSeconds++;
    const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
    const s = String(callSeconds % 60).padStart(2, '0');
    callTimer.textContent = `${m}:${s}`;
  }, 1000);
}

function startQualityMonitor(pc) {
  if (statsInterval) clearInterval(statsInterval);
  statsInterval = setInterval(async () => {
    if (!pc) return;
    try {
      const stats = await pc.getStats();
      stats.forEach(stat => {
        if (stat.type === 'inbound-rtp' && stat.kind === 'video') {
          const lost = (stat.packetsLost || 0) - lastLost;
          const recv = (stat.packetsReceived || 0) - lastRecv;
          lastLost = stat.packetsLost || 0;
          lastRecv = stat.packetsReceived || 0;
          const total = lost + recv;
          const lossRate = total > 0 ? lost / total : 0;
          
          if (lossRate > 0.1) {
            qualityDot.style.background = 'var(--red)';
            qualityText.textContent = 'плохое';
            weakBanner.classList.add('show');
            if (videoEnabled && localStream) {
              localStream.getVideoTracks().forEach(t => t.enabled = false);
              videoEnabled = false;
              btnVideo.classList.add('off');
              noVideoOverlay.classList.add('show');
            }
          } else if (lossRate > 0.03) {
            qualityDot.style.background = 'var(--yellow)';
            qualityText.textContent = 'среднее';
            weakBanner.classList.remove('show');
          } else {
            qualityDot.style.background = 'var(--green)';
            qualityText.textContent = 'хорошее';
            weakBanner.classList.remove('show');
          }
        }
      });
    } catch (e) {}
  }, 5000);
}

function setupPipDrag() {
  const pip = document.getElementById('pipWrap');
  let dragging = false, startX = 0, startY = 0, startLeft = 0, startTop = 0;
  
  pip.addEventListener('pointerdown', (e) => {
    dragging = true;
    pip.setPointerCapture(e.pointerId);
    const rect = pip.getBoundingClientRect();
    const parentRect = pip.parentElement.getBoundingClientRect();
    startX = e.clientX;
    startY = e.clientY;
    startLeft = rect.left - parentRect.left;
    startTop = rect.top - parentRect.top;
    pip.style.transition = 'none';
    e.preventDefault();
  });
  
  pip.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const parentRect = pip.parentElement.getBoundingClientRect();
    let left = startLeft + (e.clientX - startX);
    let top = startTop + (e.clientY - startY);
    left = Math.max(8, Math.min(parentRect.width - pip.offsetWidth - 8, left));
    top = Math.max(8, Math.min(parentRect.height - pip.offsetHeight - 8, top));
    pip.style.right = 'auto';
    pip.style.bottom = 'auto';
    pip.style.left = left + 'px';
    pip.style.top = top + 'px';
  });
  
  pip.addEventListener('pointerup', () => {
    dragging = false;
  });
}

// ═══════════════════════════════════════════════════════════════
//  ИНИЦИАЛИЗАЦИЯ
// ═══════════════════════════════════════════════════════════════
window.addEventListener('load', () => {
  createPeer();
  setupPipDrag();
  
  copyBtn.onclick = copyId;
  callBtn.onclick = startCall;
  endCallBtn.onclick = endCall;
  btnMic.onclick = toggleMic;
  btnVideo.onclick = toggleVideo;
  btnCamera.onclick = switchCamera;
  btnChat.onclick = toggleChat;
  chatSendBtn.onclick = sendChatMessage;
  chatInput.onkeydown = (e) => { if (e.key === 'Enter') sendChatMessage(); };
  
  document.getElementById('acceptCallBtn').onclick = acceptCall;
  document.getElementById('rejectCallBtn').onclick = rejectCall;
  
  callInput.addEventListener('input', () => {
    callBtn.disabled = callInput.value.trim().length !== 6;
  });
});

function copyId() {
  const code = myIdVal.textContent.replace(/\s/g, '');
  if (!code || code === '——') return;
  navigator.clipboard.writeText(code).then(() => {
    copyBtn.textContent = '✓ Скопировано';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = 'Копировать';
      copyBtn.classList.remove('copied');
    }, 2000);
  });
}

</script>
